<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Welcome — HydraSpecma India Private Limited</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#080808;color:#f0f0f0;font-family:'DM Sans',sans-serif}
.bg{position:fixed;inset:0;z-index:0}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,196,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(245,196,0,.04) 1px,transparent 1px);background-size:65px 65px;transform:perspective(700px) rotateX(14deg) scale(1.35);transform-origin:center bottom}
.bg-glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 60%,rgba(245,196,0,.09),transparent 65%)}
.bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse 130% 120% at 50% 50%,transparent 35%,rgba(0,0,0,.78) 100%)}
.pts{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.pt{position:absolute;width:2px;height:2px;background:#F5C400;border-radius:50%;opacity:0;animation:pfloat var(--dur,8s) linear var(--dl,0s) infinite}
@keyframes pfloat{0%{transform:translateY(100vh);opacity:0}10%{opacity:.5}90%{opacity:.15}100%{transform:translateY(-30px) translateX(var(--dx,0px));opacity:0}}
.screen{position:relative;z-index:1;width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 48px;border-bottom:1px solid rgba(245,196,0,.13);backdrop-filter:blur(12px);background:rgba(8,8,8,.45)}
.la{display:flex;align-items:center;gap:12px}
.la img{height:36px}
.lsep{width:1px;height:24px;background:rgba(255,255,255,.13)}
.ltag{font-size:10px;color:#777;letter-spacing:2px;text-transform:uppercase}
.dbadge{font-size:13px;font-weight:600;color:#F5C400;background:rgba(245,196,0,.08);border:1px solid rgba(245,196,0,.22);padding:7px 18px;border-radius:40px;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.ldot{width:6px;height:6px;background:#F5C400;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.55)}}
.stage{position:relative;overflow:hidden;width:100%;height:100%}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 48px;text-align:center;opacity:0;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.slide.entering{animation:slideIn .7s cubic-bezier(.22,.68,0,1.2) both}
.slide.leaving{animation:slideOut .5s ease-in both}
@keyframes slideIn{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-24px) scale(.98)}}
.wlabel{font-size:clamp(11px,1.3vw,15px);color:#777;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px}
.cname{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,58px);font-weight:700;color:#f0f0f0;line-height:1.1;margin-bottom:4px;text-shadow:0 0 80px rgba(245,196,0,.1)}
.cname em{font-style:normal;color:#F5C400}
.loctag{font-size:clamp(11px,1.2vw,16px);color:#666;margin-bottom:24px}
.divider{display:flex;align-items:center;gap:14px;width:min(460px,76vw);margin:0 auto 20px}
.dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(245,196,0,.4),transparent)}
.dt{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#666}
.co-tag{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,3vw,42px);font-weight:600;color:#F5C400;margin-bottom:20px}
.vgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1100px}
.vcard{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:28px 46px;min-width:240px;position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
.vcard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(245,196,0,.55),transparent);opacity:0;transition:opacity .3s}
.vcard:hover{border-color:rgba(245,196,0,.3);transform:translateY(-5px)}
.vcard:hover::after{opacity:1}
.vname{font-size:clamp(17px,2vw,26px);font-weight:600;color:#f0f0f0;margin-bottom:6px}
.vdesig{font-size:clamp(12px,1.2vw,16px);color:#777;font-style:italic}
.dots{display:flex;justify-content:center;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .4s;cursor:pointer}
.dot.on{background:#F5C400;width:22px;border-radius:4px}
.footer{padding:12px 48px;border-top:1px solid rgba(245,196,0,.08);display:flex;justify-content:space-between;align-items:center;background:rgba(8,8,8,.3);gap:20px}
.footer span{font-size:11px;color:#3a3a3a}
.footer strong{color:rgba(245,196,0,.5);font-size:11px}
.prog{height:2px;background:rgba(245,196,0,.15);border-radius:1px;overflow:hidden;flex:1;max-width:200px}
.prog-bar{height:100%;background:rgba(245,196,0,.6);border-radius:1px;transform-origin:left;transform:scaleX(0)}
</style>
</head>

var SLIDES=[{"company":"KK Wind Solutions India Pvt Ltd","visitors":[{"name":"Dharanenthiran Pradhaban","desig":"Sr. Sourcing Manager"},{"name":"Krystian Sadlon","desig":"Sr. Global Category Manager"},{"name":"Gunashekar KM","desig":"Regional Category Manager"}]},{"company":"HydraSpecma","visitors":[{"name":"Manigandan Parthasarathi","desig":"Dynamics Application Specilist"}]}];
var OUR_CO="HydraSpecma India Private Limited";

var SPEED=8000;

function esc2(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function build(){stage.innerHTML="";SLIDES.forEach(function(sl,i){var vc=sl.visitors.map(function(v){return '<div class="vcard"><div class="vname">'+esc2(v.name)+'</div><div class="vdesig">'+esc2(v.desig)+'</div></div>';}).join("");var div=document.createElement("div");div.className="slide"+(i===0?" active entering":"");div.id="slide_"+i;div.innerHTML='<div class="wlabel">'+WELCOME+'</div><div class="cname">'+OUR_CO.replace(/(India)/g,"<em>$1</em>")+'</div><div class="loctag">'+LOCATION+'</div><div class="divider"><div class="dl"></div><div class="dt">From</div><div class="dl"></div></div><div class="co-tag">'+esc2(sl.company)+'</div><div class="vgrid">'+vc+"</div>";stage.appendChild(div);});dots();}

function udots(){var ds=dotsEl.querySelectorAll(".dot");for(var i=0;i<ds.length;i++)ds[i].className="dot"+(i===cur?" on":"");}

function go(n){if(n===cur&&SLIDES.length>1)return;var p=document.getElementById("slide_"+cur);var nx=document.getElementById("slide_"+n);if(p&&n!==cur){p.className="slide leaving";(function(x){setTimeout(function(){if(x)x.className="slide";},500);})(p);}if(nx)nx.className="slide active entering";cur=n;udots();if(SLIDES.length>1){clearInterval(timer);prog();timer=setInterval(function(){go((cur+1)%SLIDES.length);},SPEED);}}
